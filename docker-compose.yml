services:
  skilltree:
    build: .
    image: skilltree-mcp:latest
    container_name: skilltree
    ports:
      - "8080:8080"
    environment:
      - SKILLTREE_HOST=0.0.0.0
      - SKILLTREE_PORT=8080
    volumes:
      # Mount external skill trees
      - ./skills:/app/skills:ro
      # Persist install state
      - skilltree-state:/root/.config/skilltree
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  skilltree-state:
